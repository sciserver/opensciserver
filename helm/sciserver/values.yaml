imagePullSecret:
# baseDomain -
#  The hostname pointing to your kubernetes ingress proxy
baseDomain:
ingressClassName:
protocol: https
port:
# prefix -
#  This allows multiple sciserver installs backed by the same hostname
#  at the ingress proxy by, for example, if prefix is "test", and the
#  baseDomain and protocol resolved to https://my.sciserver.org, then
#  this installs dashboard would be at
#  https://my.sciserver.org/test/dashboard. Leave blank to have
#  sciserver hosted at the root path.
prefix:
storageClass:

dev:
    nopvc: false

backup:
  enable: true
  nfs:
    server:

proxy:
  requestSizeMax: 128m
  readTimeout: 120
  cidrWhiteList: 128.220.0.0/16,162.129.0.0/16
  ingressUseHost: true
  enableAffinity: true

sqlServerToolsImage:
    repository: mcr.microsoft.com/mssql-tools
    tag: v1
    pullPolicy: IfNotPresent

mysqlImage:
    repository: mariadb
    tag: 10.4
    pullPolicy: IfNotPresent

# Keystone

keystoneDb:
  image:
    repository: mariadb
    tag: 10.4
    pullPolicy: IfNotPresent
  persistence:
    accessMode: ReadWriteOnce
    size: 5Gi
  name: keystone
  user: keystone
  backup:
    enable: true
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

keystone:
  image:
    repository: <<<IMAGE_REPO>>>/keystone
    tag: <<<VTAG>>>
    pullPolicy: Always
  defaultDomainId: default
  resources:
    limits:
      cpu: 500m
      memory: 12Gi
    requests:
      cpu: 100m
      memory: 128Mi

# Login Portal

loginPortal:
  replicaCount: 1
  image:
    repository: <<<IMAGE_REPO>>>/login-portal
    tag: <<<VTAG>>>
    pullPolicy: Always
  db:
    image: mariadb
    tag: 10.4.12
    storage: 2Gi
    backup:
      enable: true
  email:
    smtpHost: "null"
    smtpPort: 25
    smtpFrom: nobody@example.com
    helpdeskAddress: sciserver-helpdesk@jhu.edu
    validationEnabled: false
    validationLifetime: 10 # in minutes
    # Base64 encoded secure random key of exactly 16 or 32 bytes, used
    # when validationEnabled is true. One way to create:
    #  dd if=/dev/urandom bs=1 count=32 2>/dev/null | base64
    secretKey: "KQB7Lb7ACGHjHh8ikzjqb0GyeElfQpb1q/pUtFW1NFs="
  alertMessage:
  disclaimerInfo:
  displaySciserverLogin: true
  keycloakLoginButtonText: "Sign in with Globus"
  keycloakLoginInfoText: "<h1>Login with Globus</h1><p><a href=\"https://www.globus.org/\">Globus</a> allows you to use your educational institution or Google login to authenticate with SciServer.</p>"
  showGlobusSignout: true
  # Hosts allowed in redirects specified by callbackUrl. This is a ';' separated
  # list of regular expressions evaluated against the host portion of URL
  redirectAllowedHosts: .*
  keycloakTrustUser: keycloaktrust
  keycloakTrustProject: keycloaktrust
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

# Logging

logging:
  useUTC: true
  rabbitmq:
    # Set host to use an external rabbitmq service and disable deployment of one within this chart
    host:
    queuename: sciserver.log.database
    exchange: sciserver.log
    user:
    image:
      repository: rabbitmq
      tag: "4.1.2"
      pullPolicy: Always
    service:
      type: ClusterIP
    erlangCookie:
    replicaCount: 1
    resources:
      limits:
        cpu: 400m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 64Mi
  db:
    persistence:
      accessMode: ReadWriteOnce
      size: 10Gi
    image:
      repository: mcr.microsoft.com/mssql/server
      tag: 2017-CU13
      pullPolicy: IfNotPresent
    backup:
      enable: true
  listener:
    enabled: false
    replicaCount: 1
    image:
      repository: <<<IMAGE_REPO>>>/log-listener
      tag: <<<VTAG>>>
      pullPolicy: Always
  api:
    replicaCount: 1
    image:
      repository: <<<IMAGE_REPO>>>/logging-api
      tag: <<<VTAG>>>
      pullPolicy: Always

# RACM

racmDb:
  persistence:
    accessMode: ReadWriteOnce
    size: 10Gi
  image:
    repository: mcr.microsoft.com/mssql/server
    tag: 2022-CU17-ubuntu-22.04
    pullPolicy: Always
  backup:
    enable: true
  resources:
    limits:
      cpu: 500m
      memory: 12Gi
    requests:
      cpu: 500m
      memory: 1Gi

racm:
  replicaCount: 1
  image:
    repository: <<<IMAGE_REPO>>>/racm
    tag: <<<VTAG>>>
    pullPolicy: Always
  admin:
    username: __racm__
    email: racm@do.not.send
  jobmAdmin:
    username: __jobm__
    email: jobm@do.not.send
  flywayEnabled: true
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

# Dashboard

dashboard:
  replicaCount: 1
  buildImage:
    repository: <<<IMAGE_REPO>>>/dashboard-build
    tag: <<<VTAG>>>
    pullPolicy: Always
  serveImage:
    repository: <<<IMAGE_REPO>>>/dashboard
    tag: <<<VTAG>>>
    pullPolicy: Always
  datasets: true
  build:
    resources:
      limits:
        cpu: 500m
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 128Mi
  serve:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# File Service

fileservice:
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  image:
    repository: <<<IMAGE_REPO>>>/fileservice
    tag: <<<VTAG>>>
    pullPolicy: Always
  bootstrapperImage:
    repository: <<<IMAGE_REPO>>>/fileservice-bootstrapper
    tag: <<<VTAG>>>
    pullPolicy: Always
  identifier: "2beab3b2-26f0-4eaf-ad6b-3b37279baee9"
  nfs:
    server:
    path: /
    mountPath: /srv

  # map of extra mounts for the fileservice, each mapping must contain the
  # server, path and mountPath as above, example inline below.
  nfsExtra:
  # datavol:
  #   server: server
  #   path: /
  #   mountPath: /datavol
  # pvcVolumes:
  #   volname:
  #     claimName: claimname
  #     mountPath: /path

  # Mapping of rootVolume -> quotaManager configuration. The map should take the
  # form shown in comment
  quotaManagerMap:
  #  rootVolumeName:
  #    url: {url of quota manager for this root volume}
  #    user: {user for authenticating to quota manager}
  #    password: {password for authenticating to quota manager}
  #    readTimeout: {N in seconds. Optional, defaults to 30}

  # max request body size for fileservice uploads enforced at ingress. Use
  # "0" for unlimited, or e.g. "4g" for size limit.
  uploadSizeMax: "0"
  # This should probably be changed to true soon
  runAsIdies: false
  # 9 character strings bit flags, recognized by Java PosixFilePermissions.fromString
  defaultPerms:
    dir: rwxrwxrwx
    file: rw-rw-rw-

# Compute

compute:
  replicaCount: 1
  image:
    repository: <<<IMAGE_REPO>>>/compute
    tag: <<<VTAG>>>
    pullPolicy: Always
  # Set jobsEnabled to false to remove the jobs link from compute navbar
  jobsEnabled: true
  # Set showStorageInformation to false to remove file storage warnings from compute interactive UI
  showStorageInformation: true
  # use the "activity" timer from DB for container cleanup. Generally useful for new and k8s based installs
  enableDBBasedCleanup: true
  # use this option only in cases where you have a very old compute database (basically you should not need this)
  changelogSkipInit: false
  # Set jobsEnabled to false to remove the jobs link from compute navbar
  newComputeAppBannerEnabled: true
  # comma-separated list of groups
  privilegedGroups: admin
  dask:
    workers: 3
    memory: 1e9
    threads: 4
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  # For session based compute, clean up running containers after this many
  # seconds of inactivity (based on pings).
  # Warning: Given the ping and cleanup task timings, and that this relates to
  # real user activity, values below 600 seconds do not make much sense. Values
  # are also imprecise, as the cleanup occurs at a fixed interval.
  sessionInactiveTimeoutSecs: 3600
  # How often the web UI checks for user activity and, if the user is active,
  # pings the session container to keep it alive. This is the granularity of
  # activity tracking, so it should stay well below
  # sessionInactiveTimeoutSecs.
  sessionPingIntervalSecs: 300

computeDb:
  image:
    repository: mariadb
    tag: 10.4
    pullPolicy: IfNotPresent
  persistence:
    existingClaim: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  name: compute
  user: compute
  backup:
    enable: true
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

# Compute Manager (COMPM)
#
# A COMPM runs the jobs of a single compute domain, so an install may run
# several of them, one per entry in compm.instances. Each COMPM must first be
# registered in RACM to obtain its compmId: docker COMPMs through the RACM UI
# at {racm url}/compm/mvc/list, rdb (SciQuery) COMPMs with a POST to
# {racm url}/jobm/rest/dbcompm. For this reason no COMPM is deployed by default.
#
# Instance names are used in kubernetes object names, so they must be lower
# case alphanumerics or '-'. Any of the settings below the instances map can
# also be overridden per instance. Example:
#
#   instances:
#     small-jobs:
#       compmId: "5f3c...-uuid-from-racm"
#       jobType: docker
#       # id of the compute domain this compm was registered with, used to
#       # build the compute API url. Alternatively set domainUrl.
#       domainId: 3
#       numWorkers: 10
#     sciquery:
#       compmId: "8a1d...-uuid-from-racm"
#       jobType: rdb
#       db:
#         jdbcUrl: "jdbc:sqlserver://host:1433;database=sciquery;user=...;password=...;"
compm:
  instances: {}
  image:
    repository: <<<IMAGE_REPO>>>/compm
    tag: <<<VTAG>>>
    pullPolicy: Always
  # one of: docker, rdb
  jobType: docker
  # number of worker threads, i.e. the max number of jobs run concurrently
  numWorkers: 10
  # max number of jobs asked to JOBM for this COMPM to manage at a time
  maxNumberOfJobs: 2
  # min number of jobs in the local queue before asking JOBM for more
  minNumberOfJobs: 1
  # idle times, in seconds
  idleTimeBetweenJobs: 10
  idleTimeBetweenJobmRequests: 10
  idleTimeBetweenFailedRequests: 10
  # max tries when submitting a job to the compute API
  maxTries: 10
  # Overrides the compute API url built from domainId, e.g.
  # http://sciserver-compute/compute/api/domains/3/
  domainUrl:
  # Default location of job results folders: basePath/rootVolume/{user}/userVolume/jobsFolderRelativePath
  fileservice:
    basePath: /home/idies/workspace/
    rootVolume: Temporary
    userVolume: jobs
    jobsFolderRelativePath: /
  # CasJobs REST API url used by rdb COMPMs, defaults to {casjobs url}/RestApi/
  # when casjobs.enable is true
  casjobsApiUrl:
  # SciQuery database settings, used by rdb COMPMs only
  db:
    jdbcUrl:
    connPoolSize: 8
    resultFetchSize: 1000
  # Output writer settings for rdb COMPMs, timeouts in seconds
  outputWriter:
    numRowsPerFlush: 1000
    httpRequestTimeout: 600
    dbConnectionTimeout: 600
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

# SciQuery

sciqueryDb:
  # Set host (and optionally port, dbname and user) to point at an existing SQL
  # Server instead of deploying one as part of this chart.
  host:
  persistence:
    accessMode: ReadWriteOnce
    size: 10Gi
  image:
    repository: mcr.microsoft.com/mssql/server
    tag: 2022-CU17-ubuntu-22.04
    pullPolicy: Always
  backup:
    enable: true
  resources:
    limits:
      cpu: 500m
      memory: 12Gi
    requests:
      cpu: 500m
      memory: 1Gi

sciquery:
  # SciQuery needs resources that only exist once RACM has been bootstrapped and
  # the databases it federates have been registered: a service token, an admin
  # group, a default database server, and the domain/server holding the MyDBs.
  # There is no bootstrapper for these, so SciQuery stays off until the values
  # below are filled in.
  enable: false
  replicaCount: 1
  image:
    repository: <<<IMAGE_REPO>>>/sciquery
    tag: <<<VTAG>>>
    pullPolicy: Always
  # Let flyway bring the SciQuery metadata database up to the current schema on
  # startup. Set to false if migrations are applied out of band.
  flywayEnabled: true
  # RACM id of the user group whose members administer SciQuery.
  adminGroupId:
  # Service token of the SciQuery resource context, as registered in RACM.
  serviceToken:
  # Id, in SciQuery's own DBServer table, of the server that newly registered
  # database contexts default to. Servers are registered via api/register/server.
  defaultServerId:
  mydb:
    # SciQuery DBDomain and DBServer ids for the per-user MyDB databases.
    domainId:
    serverId:
    # Host of the SQL Server holding the MyDBs, and the accounts SciQuery uses
    # to read from and write to them.
    host:
    readonlyUsername:
    readonlyPassword:
    readwriteUsername:
    readwritePassword:
  casjobs:
    # CasJobs REST endpoint, used for metadata and privilege lookups.
    endpoint: https://skyserver.sdss.org/CasJobs/RestApi/
    # CasJobs instance UUID, used by the metadata manager.
    uuid:
  # Scratch space for uploaded CSVs on their way into a database. Backed by an
  # emptyDir, so it does not need to be writable in the image.
  uploadPath: /var/tmp/sciquery-uploads
  # Maximum size of an uploaded table, in bytes.
  maxUploadSize: 100000000
  # Rows fetched at a time from a queried database.
  resultFetchSize: 1000
  # Seconds before a query to a database times out.
  queryTimeout: 5
  # Rows buffered before each flush to the HTTP response.
  numRowsPerFlush: 1000
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

deployPoller:
  enable: false
  dryRun: false
  image:
    repository: <<<IMAGE_REPO>>>/deploy-poller
    tag: <<<VTAG>>>
  nexus:
    path: http://nexus.sciserver.org/nexus/service/rest
    user: anonymous
  devMode: "false"
  pattern: "."

keycloak:
  enabled: false
  app:
    version: "9" # one of: "9" (deprecated, WildFly-based, may not work for new installs), "18" (supported, Quarkus-based)
    adminCidrWhitelist: 128.220.0.0/16,162.129.0.0/16
  db:
    storage: 2Gi
    backup:
      enable: true
  realm:
    name: sciserver
    client: sciserver-sso
    ssl: external # one of: none, external, or all

rabbitmqElastic:
  enable: false
  elastic:
    # If elasticsearch was created by the included elasticsearch
    # chart, then "host" this will be elasticapi.{namespace} where
    # {namespace} is the namespace into which you installed the helm
    # chart
    host: elasticapi.elasticsearch
    port: 9200
  # indexes will be named {prefix}.{indexBase}-{date} where all "/" in
  # prefix have been replaced by dots, and date is like YYYY-mm-dd
  indexBase: sciserver-logs
  image: <<<IMAGE_REPO>>>/rabbitmq-to-es
  tag: <<<VTAG>>>
  replicaCount: 1

rendersvc:
  replicaCount: 1
  enable: true
  image:
    repository: <<<IMAGE_REPO>>>/rendersvc
    tag: <<<VTAG>>>
  resources:
    limits:
      cpu: 500m
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 128Mi

optionalApps:
  sciDrive:
  skyServer:
  skyQuery:

casjobs:
  enable: false
  url:
  keystone:
    admin_user: casjobs
    admin_project: service

support:
  filemanagement: https://www.sciserver.org/support/how-to-use-sciserver/#filemanagement
  createuv: https://www.sciserver.org/support/how-to-use-sciserver/#createvolume
  shareuv: https://www.sciserver.org/support/how-to-use-sciserver/#sharevolume
  unshareuv: https://www.sciserver.org/support/how-to-use-sciserver/#unshare
  groupsmanagement: https://www.sciserver.org/support/how-to-use-sciserver/#groups
  creategroup: https://www.sciserver.org/support/how-to-use-sciserver/#groupscreate
  inviteuser: https://www.sciserver.org/support/how-to-use-sciserver/#groupsinvite
  shareresource: https://www.sciserver.org/support/how-to-use-sciserver/#shareview
  activitylog: https://www.sciserver.org/support/how-to-use-sciserver/#recent
  changePassword: https://www.sciserver.org/support/how-to-use-sciserver/#change
  policies: https://www.sciserver.org/support/policies/

theme:
  navbarColor: "#003466"
  fontFamily: Helvetica Neue, Helvetica, Arial, sans-serif
  useIconsForActivities: true
  showApplicationAppRow: true
  applicationName: "SciServer"
  applicationTagline: "Data, Collaboration, Compute"
  applicationHomeUrl: "https://www.sciserver.org/"


web:
  replicaCount: 1
  image:
    repository: <<<IMAGE_REPO>>>/web
    tag: <<<VTAG>>>
    pullPolicy: Always
  gTag:
  helpdeskEmail: "sciserver-helpdesk@jhu.edu"
  jobWorkspacePath: "/home/idies/workspace/"
  newComputeSessionDefaults:
    domainName: "Interactive Docker Compute Domain"
    imageName: "Sciserver Essentials 4.0"
    quickStartConfig: "dom=Interactive%20Docker%20Compute%20Domain&img=SciServer%20Essentials%204.0&dvs=97"
  newJobDefaults:
    domainName: "Small Jobs Domain"
    imageName: "SciServer Essentials 4.0"
  globusEnabled: true
  resources:
    limits:
      cpu: 300m
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 128Mi

graphql:
  # url: ''   If URL is set, the graphql deployment will be skipped and the url will be used for the web deployment
  replicaCount: 1
  env: dev
  image:
    repository: <<<IMAGE_REPO>>>/graphql
    tag: <<<VTAG>>>
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
