{{ if .Values.sciquery.enable -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sciserver.fullname" . }}-sciquery
  labels:
    app.kubernetes.io/name: {{ include "sciserver.name" . }}
    helm.sh/chart: {{ include "sciserver.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: sciquery
spec:
  replicas: {{ .Values.sciquery.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sciserver.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sciquery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sciserver.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sciquery
    spec:
      {{ if .Values.imagePullSecret -}}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      {{ end -}}
      initContainers:
      {{ if not .Values.sciqueryDb.host -}}
      - name: wait-for-db
        image: "{{ .Values.sqlServerToolsImage.repository }}:{{ .Values.sqlServerToolsImage.tag }}"
        imagePullPolicy: {{ .Values.sqlServerToolsImage.pullPolicy }}
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
        command:
        - sh
        - -c
        - "while ! /opt/mssql-tools/bin/sqlcmd -b -S \"${SCIQUERY_DATABASE}\" -U SA -P \"${SA_PASSWORD}\" -Q 'IF DB_ID(N'\"'\"SciQuery\"'\"') IS NULL CREATE DATABASE SciQuery'; do sleep 5; done"
        env:
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "sciserver.fullname" . }}-sciquery-db
              key: password
        - name: SCIQUERY_DATABASE
          value: {{ include "sciserver.fullname" . }}-sciquery-db
      {{ end -}}
      - name: wait-for-racm
        image: "busybox:1.30-musl"
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
        command:
        - sh
        - '-c'
        - 'echo "Waiting for RACM"; until wget -T 1 --spider -q http://{{ include "sciserver.fullname" . }}-racm/{{ include "sciserver.prefix" . }}racm/actuator/health; do sleep 5; done'
      containers:
      - name: web
        image: "{{ .Values.sciquery.image.repository }}:{{ required "please specify sciquery image tag or use image manifest" .Values.sciquery.image.tag }}"
        imagePullPolicy: {{ .Values.sciquery.image.pullPolicy }}
        resources:
          {{- toYaml .Values.sciquery.resources | nindent 10 }}
        ports:
        - name: web
          containerPort: 8080
        env:
        - name: SCISERVER_PROPERTIES_FILE
          value: /etc/sciserver/application.properties
        - name: SPRING_CONFIG_LOCATION
          value: file:/etc/sciserver/application.properties
        - name: SCISERVER_CONTEXT_PATH
          value: /{{ include "sciserver.prefix" . }}sciquery
        - name: SERVER_SERVLET_CONTEXT_PATH
          value: /{{ include "sciserver.prefix" . }}sciquery
        - name: _CONFIG_HASH
          value: {{ include (print $.Template.BasePath "/sciquery/service/sciquery-secret.yaml") . | sha256sum }}
        volumeMounts:
        - name: config
          mountPath: /etc/sciserver
          readOnly: true
        - name: uploads
          mountPath: {{ .Values.sciquery.uploadPath }}
        livenessProbe:
          # Flyway runs during Spring context refresh, so a first install against 
          # a remote database can be slow to start answering. Match RACM's grace 
          # period rather than restarting mid-migration.
          initialDelaySeconds: 300
          timeoutSeconds: 5
          periodSeconds: 60
          httpGet:
            path: /{{ include "sciserver.prefix" . }}sciquery/api/ping
            port: web
      volumes:
      - name: config
        secret:
          secretName: {{ include "sciserver.fullname" . }}-sciquery
      # Staging area for uploaded CSVs on their way into a database. The files
      # are consumed within a single request, so they do not need to outlive
      # the pod.
      - name: uploads
        emptyDir: {}
{{ end -}}
