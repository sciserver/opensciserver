#------------------------------------------------------------------------------------------------------------------------
# LoginPortal parameters

auth.portal.url={{ include "sciserver.url" (dict "Values" .Values "svc" "login-portal") }}/
auth.prefetch=false
auth.cache.expiryms=120000
auth.cache.size=100

#------------------------------------------------------------------------------------------------------------------------
# RACM parameters

RACM.endpoint={{ include "sciserver.url" (dict "Values" .Values "svc" "racm") }}/
RACM.userGroup.admin={{ required "sciquery.adminGroupId is required when sciquery.enable is true" .Values.sciquery.adminGroupId }}
RACM.resourceContext.serviceToken={{ required "sciquery.serviceToken is required when sciquery.enable is true" .Values.sciquery.serviceToken }}

#------------------------------------------------------------------------------------------------------------------------
# Database server that newly registered database contexts default to. This is an
# id in SciQuery's own DBServer table, populated via the api/register/server
# endpoint.

dbContext.default.server={{ required "sciquery.defaultServerId is required when sciquery.enable is true" .Values.sciquery.defaultServerId }}

#------------------------------------------------------------------------------------------------------------------------
# MyDB parameters - the domain and server holding the per-user MyDB databases,
# and the accounts SciQuery uses to read from and write to them.

mydb.default.domain={{ required "sciquery.mydb.domainId is required when sciquery.enable is true" .Values.sciquery.mydb.domainId }}
mydb.default.server={{ required "sciquery.mydb.serverId is required when sciquery.enable is true" .Values.sciquery.mydb.serverId }}
mydb.host={{ required "sciquery.mydb.host is required when sciquery.enable is true" .Values.sciquery.mydb.host }}
mydb.readonly.username={{ required "sciquery.mydb.readonlyUsername is required when sciquery.enable is true" .Values.sciquery.mydb.readonlyUsername }}
mydb.readonly.password={{ required "sciquery.mydb.readonlyPassword is required when sciquery.enable is true" .Values.sciquery.mydb.readonlyPassword }}
mydb.readwrite.username={{ required "sciquery.mydb.readwriteUsername is required when sciquery.enable is true" .Values.sciquery.mydb.readwriteUsername }}
mydb.readwrite.password={{ required "sciquery.mydb.readwritePassword is required when sciquery.enable is true" .Values.sciquery.mydb.readwritePassword }}

#------------------------------------------------------------------------------------------------------------------------
# CasJobs parameters. The UUID is only used by the metadata manager.

CasJobs.endpoint={{ .Values.sciquery.casjobs.endpoint }}
CasJobs.UUID={{ .Values.sciquery.casjobs.uuid }}

#------------------------------------------------------------------------------------------------------------------------
# File upload parameters. basePath is scratch space for uploaded CSVs on their
# way into a database, and is backed by an emptyDir in the deployment.
# maxFileSize is in bytes.

file.upload.basePath={{ .Values.sciquery.uploadPath }}
# int64 so that large values do not render in scientific notation, which the app
# cannot parse.
file.upload.maxFileSize={{ int64 .Values.sciquery.maxUploadSize }}

#------------------------------------------------------------------------------------------------------------------------
# FileService parameters

File-service.serviceId={{ .Values.fileservice.serviceToken }}

#------------------------------------------------------------------------------------------------------------------------
# Database settings
# DB.result_fetch_size: rows retrieved at a time when getting results back from
#   a query to any database.
# DB.query_timeout: seconds before a query to a database times out.

DB.result_fetch_size={{ .Values.sciquery.resultFetchSize }}
DB.query_timeout={{ .Values.sciquery.queryTimeout }}

#------------------------------------------------------------------------------------------------------------------------
# HTTP response body parameters

HTTP.RESPONSE.BODY.numRowsPerFlush={{ .Values.sciquery.numRowsPerFlush }}

############################################################################################################
# sciserver.logging configuration properties

logging.application=SciQuery-API
logging.console=true
logging.rabbitmq.host={{ include "sciserver.rabbitmq_host" . }}
logging.rabbitmq.exchange={{ .Values.logging.rabbitmq.exchange }}
logging.rabbitmq.queuename={{ .Values.logging.rabbitmq.queuename }}

############################################################################################################
# SciQuery metadata database, also used by flyway

{{ if .Values.sciqueryDb.host -}}
spring.datasource.url=jdbc:sqlserver://{{ .Values.sciqueryDb.host }}:{{ default 1433 .Values.sciqueryDb.port }};databaseName={{ default "SciQuery" .Values.sciqueryDb.dbname }}
spring.datasource.username={{ default "SA" .Values.sciqueryDb.user }}
{{ else -}}
spring.datasource.url=jdbc:sqlserver://{{ include "sciserver.fullname" . }}-sciquery-db:1433;databaseName=SciQuery
spring.datasource.username=SA
{{ end -}}
spring.datasource.password={{ required "password required!" .Values.sciqueryDb.password }}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.default_schema=dbo
spring.flyway.enabled={{ .Values.sciquery.flywayEnabled }}
