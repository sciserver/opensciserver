{{- $c := .compm -}}
Compm.jobType = {{ $c.jobType }}
Compm.compmId = {{ required (printf "compm.instances.%s.compmId is required, register the compm in RACM to obtain it" .name) $c.compmId }}
Compm.idleTimeBetweenJobs = {{ $c.idleTimeBetweenJobs }}
Compm.idleTimeBetweenJobmRequests = {{ $c.idleTimeBetweenJobmRequests }}
Compm.idleTimeBetweenFailedRequests = {{ $c.idleTimeBetweenFailedRequests }}
Compm.maxTries = {{ $c.maxTries }}
Compm.maxNumberOfJobs = {{ $c.maxNumberOfJobs }}
Compm.minNumberOfJobs = {{ $c.minNumberOfJobs }}
Compm.numWorkers = {{ $c.numWorkers }}

RACM.baseUrl = http://{{ include "sciserver.fullname" . }}-racm/{{ include "sciserver.prefix" . }}racm/

{{ if $c.domainUrl -}}
Compute.domainUrl = {{ $c.domainUrl | trimSuffix "/" }}/
{{ else if eq $c.jobType "docker" -}}
Compute.domainUrl = http://{{ include "sciserver.fullname" . }}-compute/{{ include "sciserver.prefix" . }}compute/api/domains/{{ required (printf "compm.instances.%s.domainId or domainUrl is required for docker compms" .name) $c.domainId }}/
{{ end -}}

{{ if eq $c.jobType "rdb" -}}
DB.sciquery_db_jdbc_url = {{ required (printf "compm.instances.%s.db.jdbcUrl is required for rdb compms" .name) $c.db.jdbcUrl }}
DB.sciquery_db_conn_pool_size = {{ $c.db.connPoolSize }}
DB.result_fetch_size = {{ $c.db.resultFetchSize }}
{{ end }}
OUTPUT.WRITER.numRowsPerFlush = {{ $c.outputWriter.numRowsPerFlush }}
OUTPUT.WRITER.httpRequestTimeout = {{ $c.outputWriter.httpRequestTimeout }}
OUTPUT.WRITER.dbConnectionTimeout = {{ $c.outputWriter.dbConnectionTimeout }}

FileService.baseUrl = http://{{ include "sciserver.fullname" . }}-fileservice/{{ include "sciserver.prefix" . }}fileservice/
FileService.basePath = {{ $c.fileservice.basePath }}
FileService.rootVolume = {{ $c.fileservice.rootVolume }}
FileService.userVolume = {{ $c.fileservice.userVolume }}
FileService.jobsFolderRelativePath = {{ $c.fileservice.jobsFolderRelativePath }}

{{ if $c.casjobsApiUrl -}}
CasJobs.apiBaseUrl = {{ $c.casjobsApiUrl | trimSuffix "/" }}/
{{ else if .Values.casjobs.enable -}}
CasJobs.apiBaseUrl = {{ include "sciserver.casjobs_url" . }}/RestApi/
{{ end -}}
Login.apiBaseUrl = http://{{ include "sciserver.fullname" . }}-login-portal/{{ include "sciserver.prefix" . }}login-portal/keystone/v3/tokens/

Log.ApplicationHost = Kubernetes
Log.ApplicationName = compm_{{ .name }}
Log.MessagingHost = {{ include "sciserver.rabbitmq_host" . }}
Log.DatabaseQueueName = {{ .Values.logging.rabbitmq.queuename }}
Log.ExchangeName = {{ .Values.logging.rabbitmq.exchange }}
Log.Enabled = true
