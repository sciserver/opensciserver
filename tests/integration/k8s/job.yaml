apiVersion: batch/v1
kind: Job
metadata:
  generateName: sciserver-integration-
  labels:
    app.kubernetes.io/name: sciserver-integration-tests
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sciserver-integration-tests
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: tests
          image: ${TEST_IMAGE}
          imagePullPolicy: IfNotPresent
          terminationMessagePath: /results/delivery.json
          env:
            - name: SCISERVER_BASE_URL
              value: "${SCISERVER_BASE_URL}"
            - name: TEST_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TEST_REPORT_PATH
              value: /results/report.json
          volumeMounts:
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: results
          emptyDir:
            sizeLimit: 32Mi
