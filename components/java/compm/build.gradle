plugins {
    id 'java'
    id 'application'
    id 'eclipse'
}

group 'org.sciserver'

checkstyle {
    maxWarnings 32
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':logging')
    implementation files("${rootDir}/racm/build/dist/racm_models.jar")
    implementation 'org.apache.logging.log4j:log4j-api:2.17.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.7.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.4'
    implementation 'org.apache.httpcomponents:httpclient:4.5.2'
    implementation 'commons-io:commons-io:2.5'
    implementation 'javax.xml.bind:jaxb-api:2.2.12'
    implementation 'javax.xml:jaxb-impl:2.1'
    implementation 'javax.xml:jsr173:1.0'
    implementation 'org.opengis.cite.saxon:saxon9:9.0.0.8'
    implementation 'com.zaxxer:HikariCP:2.5.1'
    implementation 'org.postgresql:postgresql:42.2.24.jre7'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:9.2.0.jre8'
    implementation 'org.springframework:spring-web:4.3.4.RELEASE'
    implementation 'org.json:json:20190722'
    testImplementation 'org.testng:testng:6.14.3'
}

application {
    mainClass = 'compm.application.JobMaster'
}

// Fat jar, run with `java -jar` in the docker image
jar {
    manifest {
        attributes 'Main-Class': 'compm.application.JobMaster'
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

test {
    useTestNG()
}
