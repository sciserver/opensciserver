#---------------------------------------------------------------------------------------------------------
#COMPM configuration properties:

# type of job being run. Set to "rdb" for relational database queries, or "docker" for jobs run in docker containers.
Compm.jobType = docker
# identifier of this compm, as registrerd in JOBM/RACM
Compm.compmId = ***

# idle time interval (measured in seconds) at the end of each JobWorker's cycle where the worker asks the master for a new job.
Compm.idleTimeBetweenJobs = 10
# idle time interval (measured in seconds) at the end of the Master's cycle that asks JOBM for new jobs and new messages for its currently managed jobs.
Compm.idleTimeBetweenJobmRequests = 10
# idle time interval (measured in seconds) at the end of loops that repeatedly do calls to an API in case the API is unresponsive at the time.
Compm.idleTimeBetweenFailedRequests = 10
# max number tries before exiting after failed requests for submitting job to sciserver-compute API
Compm.maxTries = 10

# maximum number of jobs asked to JOBM for COMPM to manage at a time.
Compm.maxNumberOfJobs = 2
#minimum number of jobs that COMPM shall reach as stored in its local queue, before COMPM asking JOBM for a new batch of available jobs.
Compm.minNumberOfJobs = 1
#number of worker threads spawn by compm
Compm.numWorkers = 1

#---------------------------------------------------------------------------------------------------------
# RACM configuration properties:

RACM.baseUrl = https://scitest12.pha.jhu.edu/racm/

#---------------------------------------------------------------------------------------------------------
# COMPUTE configuration properties:

# base url pointing to the compute API and the compute domain that compm is managing
Compute.domainUrl = http://scitest12.pha.jhu.edu/compute/api/domains/3/

#---------------------------------------------------------------------------------------------------------
# DB query configuration properties:
DB.sciquery_db_jdbc_url = jdbc:sqlserver://;servername=***;database=sciquery;user=***;password=***;
DB.sciquery_db_conn_pool_size = 8
DB.result_fetch_size=1000

#------------------------------------------------------------------------------------------------------------------------
# Setting for output writers (timeouts measured in seconds):
OUTPUT.WRITER.numRowsPerFlush = 1000
OUTPUT.WRITER.httpRequestTimeout = 600
OUTPUT.WRITER.dbConnectionTimeout = 600

#---------------------------------------------------------------------------------------------------------
# FileService configuration properties:

FileService.baseUrl = http://scitest12.pha.jhu.edu/fileservice/
FileService.basePath = /home/idies/workspace/
FileService.rootVolume = volumes
FileService.userVolume = jobsUserVolume
FileService.jobsFolderRelativePath = jobs/

#---------------------------------------------------------------------------------------------------------
# CasJobs configuration properties:

# base url pointing to the CasJobs API
CasJobs.apiBaseUrl = https://skyserver.sdss.org/CasJobs/RestApi/

#---------------------------------------------------------------------------------------------------------
# Login Portal configuration properties:
Login.apiBaseUrl =  https://apps.sciserver.org/login-portal/keystone/v3/tokens/

#---------------------------------------------------------------------------------------------------------
# sciserver.logging configuration properties:

Log.ApplicationHost = scitest12
# Log.ApplicationName is a string that should uniquely identify the compm, e.g, Log.ApplicationName = "compm_" + Compm.compmId
Log.ApplicationName = compute-manager_docker_SmallJobs
Log.MessagingHost = scitest09.sdss.pha.jhu.edu
Log.DatabaseQueueName = sciserver.log.database_scitest02
Log.ExchangeName = sciserver.log_scitest02
Log.Enabled = true
